# Hourly check that the live site's catalog is still updating (tools/check-fresh.mjs). A scan can
# "succeed" while nothing new gets published (a deploy stuck, a timer that stopped); this catches it.
# A failure here sends GitHub's failed-workflow email. cron-job.org starts it every hour through
# GitHub's API (workflow_dispatch), as for heat; GitHub's own schedule below is only a backup.
name: Freshness check
on:
  schedule: [{ cron: "41 * * * *" }]
  workflow_dispatch:
permissions: { contents: read, actions: write }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      # GitHub sometimes leaves a deploy "waiting" on its Pages environment for hours (seen on
      # heat). While it waits, newer scans queue behind it and the site stops updating. A scan
      # still waiting after 25 minutes, or queued for over 90, is cancelled so the next one runs.
      - name: Cancel scans stuck in waiting
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          now=$(date -u +%s)
          gh run list -R "$GITHUB_REPOSITORY" --workflow pages.yml --limit 30 --json databaseId,status,createdAt \
            --jq '.[] | select(.status == "waiting" or .status == "queued") | "\(.databaseId) \(.status) \(.createdAt)"' |
          while read -r id status at; do
            age=$(( (now - $(date -u -d "$at" +%s)) / 60 ))
            if { [ "$status" = waiting ] && [ $age -gt 25 ]; } || [ $age -gt 90 ]; then
              echo "::warning::scan $id $status for $age minutes: cancelling it so the next one can run"
              gh run cancel "$id" -R "$GITHUB_REPOSITORY" || true
            fi
          done
      - run: node tools/check-fresh.mjs https://flattery.sala.company
