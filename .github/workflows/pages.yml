# Scans X every 8 hours and publishes the catalog with the site. Each run builds on the
# previously published catalog: nothing found is dropped, known posts get fresh metrics,
# and linked GitHub repos are re-checked for stars and downloads.
#
# X bills per post read, so --max-reads caps each run (1,000 posts × 3 runs a day). Raise or
# lower it to fit the budget. A 6-minute budget keeps a normal run short.
#
# Backfill: Actions → Scan and deploy → Run workflow, with "backfill_days" (e.g. 21) and a
# higher "max_reads" (e.g. 2500), searches X's full archive for popular clones from those
# days. It needs full-archive search on the X plan; without it the run says so and goes on
# with the normal 7-day scan.
#
# Secrets (Settings → Secrets and variables → Actions):
#   X_BEARER_TOKEN     X API app bearer token
#   ANTHROPIC_API_KEY  for Claude Haiku (triage and reply sentiment)
# Without them the scan fails and the previous catalog is republished.
#
# Timer: cron-job.org can start this through GitHub's API (POST
# /repos/jamalxcode/flattery/actions/workflows/pages.yml/dispatches), as for heat,
# because GitHub's own schedule runs late or not at all. The schedule below is a backup.
name: Scan and deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: "17 */8 * * *" }]
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Also search the last N days of X's archive for popular clones (0 = normal scan)"
        default: "0"
      search:
        description: "Also search X for these names, comma-separated (e.g. ArtCraft)"
        default: ""
      max_reads:
        description: "Most X posts to read in this run (X bills per post)"
        default: "1000"
permissions: { contents: write, pages: write, id-token: write }  # contents: write saves the catalog to the data branch
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      # The catalog is kept on the `data` branch (one latest.json, a commit per run), so a
      # Pages hiccup can't wipe it. Never start from empty unless there's truly nothing saved.
      - name: Load the saved catalog
        run: |
          set +e
          git ls-remote --exit-code origin refs/heads/data >/dev/null; has=$?
          set -e
          if [ $has -eq 0 ]; then
            git fetch -q --depth 1 origin data
            git show FETCH_HEAD:latest.json > "$RUNNER_TEMP/prev.json"
            echo "loaded the catalog from the data branch"
          elif [ $has -eq 2 ]; then
            # No data branch yet: take the published copy once, while moving over
            code=$(curl -sS -o "$RUNNER_TEMP/prev.json" -w '%{http_code}' "${{ steps.pages.outputs.base_url }}/data/latest.json" || echo 000)
            if [ "$code" = 200 ]; then echo "loaded the catalog from the site";
            elif [ "$code" = 404 ]; then rm -f "$RUNNER_TEMP/prev.json"; echo "no saved catalog anywhere, starting fresh";
            else echo "::error::couldn't load the saved catalog (HTTP $code); stopping rather than starting from empty"; exit 1; fi
          else
            echo "::error::couldn't reach the data branch; stopping rather than starting from empty"; exit 1
          fi
      - name: Scan X
        id: scan
        env:
          X_BEARER_TOKEN: "${{ secrets.X_BEARER_TOKEN }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
          GITHUB_TOKEN: "${{ github.token }}"
          SEARCH: "${{ inputs.search }}"
        run: |
          mkdir -p data
          BACKFILL="${{ inputs.backfill_days || '0' }}"
          if [ "$BACKFILL" != "0" ]; then EXTRA="--backfill-days $BACKFILL --max-reactions 40 --budget-sec 900"; else EXTRA="--budget-sec 360"; fi
          if node tools/scan.mjs --max-reads "${{ inputs.max_reads || '1000' }}" --rotate $EXTRA ${SEARCH:+--search "$SEARCH"} --cache "$RUNNER_TEMP/prev.json" --out data; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::scan failed, republishing the previous catalog"
            [ -s "$RUNNER_TEMP/prev.json" ] && cp "$RUNNER_TEMP/prev.json" data/latest.json
          fi
      - name: Save the catalog to the data branch
        if: steps.scan.outputs.ok == 'true'
        run: |
          store="$RUNNER_TEMP/store"
          if git fetch -q --depth 1 origin data 2>/dev/null; then git worktree add -q -B data "$store" FETCH_HEAD
          else git worktree add -q --orphan -b data "$store"; fi
          cp data/latest.json "$store/latest.json"
          cd "$store"
          git add latest.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Catalog $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "catalog unchanged"; exit 0; }
          git push -q origin data
      - run: rm -rf node_modules
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
