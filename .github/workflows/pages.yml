# Scans GitHub every 10 minutes and publishes the results with the site, so visitors
# see the latest scan without a token. Reuses the previous published scan as a cache:
# a repo is re-fetched at most every 6 hours, which keeps this inside the Actions
# token's 1,000 requests an hour.
name: Scan and deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch: {}
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/configure-pages@v5
        id: pages
      - name: Fetch the previous scan
        run: curl -fsSL "${{ steps.pages.outputs.base_url }}/data/latest.json" -o "$RUNNER_TEMP/prev.json" || echo "no previous scan"
      - name: Scan GitHub
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p data
          if ! node tools/scan.mjs --max-repos 120 --max-fresh 30 --cache "$RUNNER_TEMP/prev.json" --out data; then
            echo "::warning::scan failed, republishing the previous scan"
            [ -s "$RUNNER_TEMP/prev.json" ] && cp "$RUNNER_TEMP/prev.json" data/latest.json
          fi
      - uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
