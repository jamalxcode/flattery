# Scans X every 8 hours and publishes the catalog with the site. Each run builds on the
# previously published catalog: nothing found is dropped, known posts get fresh metrics,
# and linked GitHub repos are re-checked for stars and downloads.
#
# X bills per post read, so --max-reads caps each run (1,000 posts × 3 runs a day). Raise or
# lower it to fit the budget. A 6-minute budget keeps a normal run short.
#
# Backfill: Actions → Scan and deploy → Run workflow, with "backfill_days" (e.g. 21) and a
# higher "max_reads" (e.g. 2500), searches X's full archive for popular clones from those
# days. It needs full-archive search on the X plan; without it the run says so and goes on
# with the normal 7-day scan.
#
# Secrets (Settings → Secrets and variables → Actions):
#   X_BEARER_TOKEN     X API app bearer token
#   ANTHROPIC_API_KEY  for Claude Haiku (triage and reply sentiment)
#   X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, X_ACCESS_SECRET  (optional) post the newsletter and
#                      newly loved projects on X as the Flattery account; without them nothing is posted
# Without them the scan fails and the previous catalog is republished.
#
# Timer: as for heat.sala.company, cron-job.org starts this every 8 hours through GitHub's API
# (POST /repos/jamalxcode/flattery/actions/workflows/pages.yml/dispatches, body {"ref":"main"}),
# with a fine-grained token limited to the repo (Actions: read and write), because GitHub's own
# schedule runs late or not at all. The schedule below stays on as a backup, and
# freshness.yml (hourly) emails a failure if the live catalog stops updating.
name: Scan and deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: "17 */8 * * *" }]
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Also search the last N days of X's archive for popular clones (0 = normal scan)"
        default: "0"
      search:
        description: "Also search X for these names, comma-separated (e.g. ArtCraft)"
        default: ""
      search_days:
        description: "How many days back the name search goes"
        default: "21"
      max_reads:
        description: "Most X posts to read in this run (X bills per post)"
        default: "1000"
# contents: write saves the catalog to the data branch
permissions: { contents: write, pages: write, id-token: write, actions: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      # The catalog is kept on the `data` branch (one latest.json, a commit per run), so a
      # Pages hiccup can't wipe it. Never start from empty unless there's truly nothing saved.
      - name: Load the saved catalog
        run: |
          set +e
          git ls-remote --exit-code origin refs/heads/data >/dev/null; has=$?
          set -e
          if [ $has -eq 0 ]; then
            git fetch -q --depth 1 origin data
            git show FETCH_HEAD:latest.json > "$RUNNER_TEMP/prev.json"
            mkdir -p data
            git archive FETCH_HEAD thumbs 2>/dev/null | tar -x -C data || true  # stored thumbnails
            git archive FETCH_HEAD og 2>/dev/null | tar -x -C data || true      # stored share images
            echo "loaded the catalog from the data branch ($(ls data/thumbs 2>/dev/null | wc -l) thumbnails)"
          elif [ $has -eq 2 ]; then
            # No data branch yet: take the published copy once, while moving over
            code=$(curl -sS -o "$RUNNER_TEMP/prev.json" -w '%{http_code}' "${{ steps.pages.outputs.base_url }}/data/latest.json" || echo 000)
            if [ "$code" = 200 ]; then echo "loaded the catalog from the site";
            elif [ "$code" = 404 ]; then rm -f "$RUNNER_TEMP/prev.json"; echo "no saved catalog anywhere, starting fresh";
            else echo "::error::couldn't load the saved catalog (HTTP $code); stopping rather than starting from empty"; exit 1; fi
          else
            echo "::error::couldn't reach the data branch; stopping rather than starting from empty"; exit 1
          fi
      - name: Scan X
        id: scan
        env:
          X_BEARER_TOKEN: "${{ secrets.X_BEARER_TOKEN }}"
          ANTHROPIC_API_KEY: "${{ secrets.ANTHROPIC_API_KEY }}"
          X_API_KEY: "${{ secrets.X_API_KEY }}"
          X_API_SECRET: "${{ secrets.X_API_SECRET }}"
          X_ACCESS_TOKEN: "${{ secrets.X_ACCESS_TOKEN }}"
          X_ACCESS_SECRET: "${{ secrets.X_ACCESS_SECRET }}"
          GITHUB_TOKEN: "${{ github.token }}"
          SEARCH: "${{ inputs.search }}"
          SEARCH_DAYS: "${{ inputs.search_days || '21' }}"
          X_COST_PER_READ: "${{ vars.X_COST_PER_READ }}"  # optional repo variable, e.g. 0.005
          X_MONTHLY_READS: "${{ vars.X_MONTHLY_READS || '60000' }}"  # X reads per month before scans pause reading X
        run: |
          mkdir -p data
          BACKFILL="${{ inputs.backfill_days || '0' }}"
          if [ "$BACKFILL" != "0" ]; then EXTRA="--backfill-days $BACKFILL --max-reactions 40 --budget-sec 900"; else EXTRA="--budget-sec 360"; fi
          if node tools/scan.mjs --max-reads "${{ inputs.max_reads || '1000' }}" --rotate $EXTRA ${SEARCH:+--search "$SEARCH" --search-days "$SEARCH_DAYS"} --cache "$RUNNER_TEMP/prev.json" --out data; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::scan failed, republishing the previous catalog"
            [ -s "$RUNNER_TEMP/prev.json" ] && cp "$RUNNER_TEMP/prev.json" data/latest.json
          fi
      # Share preview images (data/og/*.png), redrawn only when what they show changes
      - name: Draw share images
        continue-on-error: true
        run: |
          [ -s data/latest.json ] || { echo "no catalog yet"; exit 0; }
          sudo apt-get install -y -qq fonts-noto-color-emoji >/dev/null 2>&1 || true
          npx playwright install --with-deps chromium >/dev/null
          node tools/cards.mjs --data data/latest.json
      # GitHub switches off scheduled workflows in a repo with no new commits for 60 days.
      # Re-enabling this workflow on every run keeps the 8-hourly scans going with nobody
      # touching the code (the same approach as the common "keepalive" actions).
      - name: Keep the schedule switched on
        continue-on-error: true
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable" && echo "schedule kept on"
      - name: Save the catalog to the data branch
        if: steps.scan.outputs.ok == 'true'
        run: |
          store="$RUNNER_TEMP/store"
          if git fetch -q --depth 1 origin data 2>/dev/null; then git worktree add -q -B data "$store" FETCH_HEAD
          else git worktree add -q --orphan -b data "$store"; fi
          cp data/latest.json "$store/latest.json"
          if [ -d data/thumbs ]; then mkdir -p "$store/thumbs" && cp -r data/thumbs/. "$store/thumbs/"; fi
          if [ -d data/og ]; then mkdir -p "$store/og" && cp -r data/og/. "$store/og/"; fi
          cd "$store"
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Catalog $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "catalog unchanged"; exit 0; }
          git push -q origin data
      - run: rm -rf node_modules
      # New file names each deploy, so browsers never keep running an old script
      - run: sed -i "s/__BUILD__/${GITHUB_SHA::7}/g" index.html
      # A page per project (p/<code>/) with its own title and preview, plus sitemap.xml
      # and the "Free alternatives to X" pages and the stats page
      - name: Write project, alternatives and stats pages
        run: |
          if [ -s data/latest.json ]; then
            node tools/slim.mjs --data data/latest.json --out data/site.json
            node tools/pages.mjs --data data/latest.json --out .
            node tools/stats.mjs --data data/latest.json --out .
          else echo "no catalog yet"; fi
      - uses: actions/upload-pages-artifact@v4
        with: { path: . }
      - id: deployment
        uses: actions/deploy-pages@v4
