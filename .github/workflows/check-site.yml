# Opens the live site in a real browser on GitHub's servers and tries the search box,
# since a cloud session can't reach the site. Run it from Actions → Check site.
name: Check site
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm i -s playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > check.mjs <<'JS'
          import { chromium } from "playwright";
          const b = await chromium.launch();
          for (const [w, label] of [[1280, "desktop"], [390, "phone"]]) {
            const p = await b.newPage({ viewport: { width: w, height: 900 } });
            const errors = [];
            p.on("pageerror", e => errors.push(e.message));
            p.on("console", m => m.type() === "error" && errors.push(m.text()));
            await p.goto("https://flattery.sala.company/", { waitUntil: "networkidle" });
            await p.waitForSelector(".grid .card", { timeout: 20000 });
            const scripts = await p.evaluate(() => [...document.scripts].map(s => s.src).filter(Boolean));
            console.log(`== ${label}: ${await p.locator(".grid .card").count()} cards, scripts ${scripts.join(" ")}`);
            for (const q of ["photo", "adobe photoshop", "craft", "loved", "word clone", "zzzz"]) {
              await p.fill("#search", "");
              await p.type("#search", q, { delay: 30 });
              await p.waitForTimeout(800);
              const r = await p.evaluate(() => ({
                cards: document.querySelectorAll(".grid .card").length,
                results: document.querySelector("[data-r=results]")?.textContent.trim(),
                visible: (() => { const t = document.querySelector("#apps").getBoundingClientRect().top; return t >= 0 && t < innerHeight; })(),
                first: document.querySelector(".grid .card h3")?.textContent.trim(),
              }));
              console.log(`  "${q}": ${JSON.stringify(r)}`);
            }
            console.log(`  errors: ${JSON.stringify(errors.filter(e => !/favicon|goatcounter/i.test(e)))}`);
          }
          await b.close();
          JS
          node check.mjs
